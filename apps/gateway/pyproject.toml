[project]
name = "staypilot-gateway"
version = "0.1.0"
description = "Gateway API and guest portal"
requires-python = ">=3.12,<3.13"
dependencies = [
    "staypilot-contracts==0.1.0",
    "staypilot-security==0.1.0",
    "staypilot-data==0.1.0",
    "staypilot-config==0.1.0",
    "staypilot-observability==0.1.0",
    "fastapi>=0.133,<1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build==0.11.24"]
build-backend = "uv_build"


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "integration: requires local services such as PostgreSQL",
    "cloud: requires explicitly authorized cloud access",
    "eval: evaluates agent behavior",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]