[project]
name = "staypilot"
version = "0.1.0"
description = "StayPilot multi-agent hotel services workspace"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/gateway", "apps/agents/*", "packages/*"]

[tool.uv.sources]
staypilot-contracts = { workspace = true }
staypilot-security = { workspace = true }
staypilot-data = { workspace = true }
staypilot-config = { workspace = true }
staypilot-observability = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.0.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: requires local services such as PostgreSQL",
    "cloud: requires explicitly authorized cloud access",
    "eval: evaluates agent behavior",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
