version = 1
revision = 3
requires-python = "==3.12.*"

[manifest]
members = [
    "staypilot",
    "staypilot-amenities",
    "staypilot-billing",
    "staypilot-booking",
    "staypilot-config",
    "staypilot-contracts",
    "staypilot-data",
    "staypilot-gateway",
    "staypilot-master",
    "staypilot-observability",
    "staypilot-profile",
    "staypilot-security",
]

[[package]]
name = "staypilot"
version = "0.1.0"
source = { virtual = "." }

[[package]]
name = "staypilot-amenities"
version = "0.1.0"
source = { editable = "apps/agents/amenities" }
dependencies = [
    { name = "staypilot-config" },
    { name = "staypilot-contracts" },
    { name = "staypilot-data" },
    { name = "staypilot-observability" },
    { name = "staypilot-security" },
]

[package.metadata]
requires-dist = [
    { name = "staypilot-config", editable = "packages/config" },
    { name = "staypilot-contracts", editable = "packages/contracts" },
    { name = "staypilot-data", editable = "packages/data" },
    { name = "staypilot-observability", editable = "packages/observability" },
    { name = "staypilot-security", editable = "packages/security" },
]

