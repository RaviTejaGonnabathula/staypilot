name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.24"

      - name: Install Python
        run: uv python install 3.12

      - name: Install workspace
        run: uv sync --locked --all-packages

      - name: Check lint
        run: uv run --locked --all-packages ruff check .

      - name: Check formatting
        run: uv run --locked --all-packages ruff format --check .

      - name: Run local tests
        run: uv run --locked --all-packages pytest -m "not integration and not cloud and not eval"